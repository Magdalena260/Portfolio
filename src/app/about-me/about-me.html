<section id="about" class="about-me">

  <div class="about-left">

    <h2>{{ 'about.title' | translate }}</h2>

    <p>
      {{ 'about.text' | translate }}
    </p>

    <div class="info-item">
      <img src="assets/icons/house.svg" alt="Home Icon">
      <span>{{ 'about.location' | translate }}</span>
    </div>

    <div class="info-item">
      <img src="assets/icons/laptop_chromebook.svg" alt="Laptop Icon">
      <span>{{ 'about.remote' | translate }}</span>
    </div>

    <a href="#contact" class="talk-btn">
      {{ 'about.button' | translate }}
    </a>

  </div>

  <div class="about-right">
    <img class="profile-img" src="assets/icons/testfoto.jpg" alt="Profile Image">
  </div>

</section>
