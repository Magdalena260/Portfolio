<section id="about" class="about-me">

  <div class="about-left">

    <h2>{{ 'about.title' | translate }}</h2>

    <p>{{ 'about.text' | translate }}</p>

    <div class="info-item">
      <img src="assets/icons/house.svg" alt="">
      <span>{{ 'about.location' | translate }}</span>
    </div>

    <div class="info-item">
      <img src="assets/icons/laptop_chromebook.svg" alt="">
      <span>{{ 'about.remote' | translate }}</span>
    </div>

    <a href="#contact" class="talk-btn">
      {{ 'about.button' | translate }}
    </a>

  </div>

  <div class="about-right">
    <img class="profile-img" src="assets/icons/testfoto2.png" alt="">

    <!--ABOUT ARROW -->
   <div class="about-arrow" (click)="scrollToContact()">
  <img src="assets/arrows/arrow_right.svg" alt="Arrow">
</div>

  </div>

</section>
