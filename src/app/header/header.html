<div class="header">

  <div class="left">
    <img src="assets/icons/logo_mlheribor.svg" alt="Logo">
  </div>

  <div class="right">

    <div class="lang">

      <div
        [class.active]="currentLang === 'en'"
        (click)="switchLanguage('en')">
        EN
      </div>

      <div
        [class.active]="currentLang === 'de'"
        (click)="switchLanguage('de')">
        DE
      </div>

    </div>

    <!-- BURGER -->
    <div class="burger" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

</div>

<!-- MENU -->
<nav class="mobile-menu" [class.open]="menuOpen">

  <div class="menu-top">
    <img src="assets/icons/logo_mlheribor.svg" class="menu-logo">
  </div>

  <div class="menu-center">
    <div class="menu-item" (click)="scrollTo('about')">About</div>
    <div class="menu-item" (click)="scrollTo('skills')">Skills</div>
    <div class="menu-item" (click)="scrollTo('portfolio')">Portfolio</div>
  </div>

</nav>
