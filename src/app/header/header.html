<div class="header">

  <div class="left" (click)="goHome()">
    <img src="assets/icons/logo_mlheribor.svg" alt="Logo">
  </div>

  <div class="right">

    <div class="lang">
      <div [class.active]="currentLang === 'en'" (click)="switchLanguage('en')">
        EN
      </div>

      <div [class.active]="currentLang === 'de'" (click)="switchLanguage('de')">
        DE
      </div>
    </div>

    <div class="burger" (click)="toggleMenu()" [class.open]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

</div>

<nav class="mobile-menu" [class.open]="menuOpen">

  <div class="close" (click)="toggleMenu()">✕</div>

  <div class="menu-center">

    <div class="menu-item" (click)="scrollTo('about')">
      {{ 'header.about' | translate }}
      <span class="box"></span>
    </div>

    <div class="menu-item" (click)="scrollTo('skills')">
      {{ 'header.skills' | translate }}
      <span class="box"></span>
    </div>

    <div class="menu-item" (click)="scrollTo('portfolio')">
      {{ 'header.portfolio' | translate }}
      <span class="box"></span>
    </div>

  </div>

  <div class="menu-bottom">

    <div class="menu-bottom-left">
      <h2>Say Hi!</h2>

    </div>

    <div class="menu-bottom-right">
   <a href="https://github.com/Magdalena260" target="_blank">
          <img class="github" src="assets/icons/github.png" alt="GitHub">
        </a>
