<div class="header">

  <div class="left">
    <img src="assets/icons/logo_mlheribor.svg" alt="Logo">
  </div>

  <div class="right">

    <div class="lang">

      <div
        [class.active]="currentLang === 'en'"
        [class.clicked]="clickState === 'en'"
        (click)="switchLanguage('en')">
        EN
      </div>

      <div
        [class.active]="currentLang === 'de'"
        [class.clicked]="clickState === 'de'"
        (click)="switchLanguage('de')">
        DE
      </div>

    </div>

    <div class="burger" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

</div>

<nav class="mobile-menu" [class.open]="menuOpen">

  <div class="menu-center">

    <div class="menu-item" (click)="scrollTo('about')">
      About
    </div>

    <div class="menu-item" (click)="scrollTo('skills')">
      Skills
    </div>

    <div class="menu-item" (click)="scrollTo('portfolio')">
      Portfolio
    </div>

  </div>

</nav>
