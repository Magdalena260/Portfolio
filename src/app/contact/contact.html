<div id="contact" class="contact">

  <!-- BACKGROUND SHAPE -->
  <img class="background-shape" src="assets/arrows/rectangle.svg" alt="">

  <div class="contact-inner">

    <!-- LEFT SECTION -->
    <div class="left">
      <h2>Say hi!</h2>
    </div>

    <!-- RIGHT SECTION -->
    <div class="right">

      <!-- INTRO TEXT -->
      <div class="text">
        <p class="green-text">Want to discuss a new project?</p>
        <p class="description">
          Say hello! Let's discuss your ideas and make it happen.
        </p>
      </div>

      <!-- CONTACT FORM -->
      <form class="contact-form">

        <input type="text" placeholder="Your name">
        <input type="email" placeholder="Your email">

        <!-- MESSAGE FIELD -->
        <div class="message-box">
          <textarea placeholder="Your message"></textarea>
          <img class="message-icon" src="assets/arrows/group.svg" alt="message icon">
        </div>

        <!-- PRIVACY CHECKBOX -->
        <div class="privacy">
          <input type="checkbox" id="privacy">
          <label for="privacy">
            I've read the <a href="#">privacy policy</a> and agree to the processing of my data as outlined.
          </label>
        </div>

        <!-- SEND BUTTON -->
        <button class="send-btn">Send message</button>

      </form>

    </div>

  </div>

  <!-- SCROLL TO TOP BUTTON -->
  <div class="top-right">
    <img
      src="assets/arrows/arrow_top.svg"
      alt="scroll to top"
      (click)="scrollToTop()">
  </div>

</div>
